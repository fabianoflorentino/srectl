# srectl defaults. Every key can be overridden by a SRECTL_* environment
# variable (e.g. SRECTL_CLUSTER_NODES=5) or by the --config flag pointing at a
# different file. Precedence: flag > env > file > default.
cluster:
  name: srectl
  nodes: 3 # 1 control-plane + 2 workers

components:
  argocd: true
  observability: true
  security: true
  chaos: true
  apps: true
  projects: true

argocd:
  namespace: argocd
  version: "10.18.0" # argo/argo-cd Helm chart version
  repo: https://github.com/fabianoflorentino/srectl
  revision: main

monitoring:
  namespace: monitoring
  grafana:
    secret: kube-prometheus-stack-grafana

slo:
  namespace: monitoring
  cronjob: slo-generator
  service: kube-prometheus-stack-prometheus
  port: 9090

registry: localhost:5000 # image registry for local builds
