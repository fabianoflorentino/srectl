# Baseline Kyverno CEL policies (Kyverno >= 1.20), scoped to the demo namespace so
# they demonstrate enforcement without blocking platform components.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
spec:
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  matchConditions:
    - name: only-demo-namespace
      expression: object.metadata.namespace == 'demo'
  validations:
    - expression: >-
        object.spec.containers.all(c, !c.image.endsWith(':latest')) &&
        object.spec.?initContainers.orValue([]).all(c, !c.image.endsWith(':latest'))
      message: "The 'latest' image tag is not allowed; pin a specific tag."
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-requests-limits
spec:
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  matchConditions:
    - name: only-demo-namespace
      expression: object.metadata.namespace == 'demo'
  validations:
    - expression: >-
        object.spec.containers.all(c,
          c.?resources.?requests.?cpu.orValue('') != '' &&
          c.?resources.?requests.?memory.orValue('') != '' &&
          c.?resources.?limits.?cpu.orValue('') != '' &&
          c.?resources.?limits.?memory.orValue('') != '')
      message: "CPU and memory requests and limits are required."
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-run-as-nonroot
spec:
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  validationActions:
    - Audit
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  matchConditions:
    - name: only-demo-namespace
      expression: object.metadata.namespace == 'demo'
  validations:
    - expression: "object.spec.?securityContext.?runAsNonRoot.orValue(false) == true"
      message: "Pods must set securityContext.runAsNonRoot=true."
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-hostpath
spec:
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  matchConditions:
    - name: only-demo-namespace
      expression: object.metadata.namespace == 'demo'
  validations:
    - expression: "object.spec.?volumes.orValue([]).all(v, !has(v.hostPath))"
      message: "hostPath volumes are not allowed."
