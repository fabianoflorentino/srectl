apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fraudctl
  namespace: projects
  labels:
    app: fraudctl
spec:
  ingressClassName: nginx
  rules:
    - host: fraudctl.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fraudctl
                port:
                  number: 80
