apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cert-validate-monitor
  namespace: projects
  labels:
    app.kubernetes.io/name: certificate-validate
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: certificate-validate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: certificate-validate
    spec:
      serviceAccountName: cert-validate-monitor
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: monitor
          image: srectl/certificate-validate:dev
          imagePullPolicy: IfNotPresent
          args:
            - k8s
            - monitor
            - --watch-interval=300
            - --check-revocation
            - --metrics-addr=:9102
          ports:
            - containerPort: 9102
              name: metrics
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
