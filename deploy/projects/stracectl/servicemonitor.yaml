apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: stracectl
  namespace: projects
  labels:
    app.kubernetes.io/name: stracectl
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: stracectl
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames:
      - projects
