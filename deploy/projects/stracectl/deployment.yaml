apiVersion: apps/v1
kind: Deployment
metadata:
  name: stracectl-demo
  namespace: projects
  labels:
    app: stracectl-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stracectl-demo
  template:
    metadata:
      labels:
        app: stracectl-demo
        app.kubernetes.io/name: stracectl
    spec:
      # Required so the sidecar sees the app container's processes.
      shareProcessNamespace: true
      containers:
        - name: app
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - "while true; do date; cat /etc/hostname; sleep 2; done"
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
        - name: stracectl
          image: fabianoflorentino/stracectl:v1.0.140
          imagePullPolicy: IfNotPresent
          args:
            - attach
            - --serve
            - :8080
            - --container
            - sh
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            seccompProfile:
              type: Unconfined
            capabilities:
              drop:
                - ALL
              add:
                - SYS_PTRACE
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
