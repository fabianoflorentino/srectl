apiVersion: apps/v1
kind: Deployment
metadata:
  name: seraph
  namespace: projects
  labels:
    app: seraph
    app.kubernetes.io/name: seraph
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seraph
  template:
    metadata:
      labels:
        app: seraph
        app.kubernetes.io/name: seraph
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: seraph
          image: srectl/seraph:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERAPH_SYNC_INTERVAL
              value: "300"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
