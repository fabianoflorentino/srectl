apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/fabianoflorentino/srectl
    targetRevision: main
    path: deploy/chaos
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: chaos
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
