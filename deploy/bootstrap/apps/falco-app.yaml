apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://falcosecurity.github.io/charts
    chart: falco
    targetRevision: 9.2.2
    helm:
      values: |
        driver:
          kind: modern_ebpf
        falco:
          json_output: true
        falcosidekick:
          enabled: true
          config:
            loki:
              hostport: "http://loki.monitoring.svc:3100"
              format: json
  destination:
    server: https://kubernetes.default.svc
    namespace: security
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
