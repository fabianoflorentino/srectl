apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://aquasecurity.github.io/helm-charts/
    chart: trivy-operator
    targetRevision: 0.38.1
    helm:
      values: |
        targetNamespaces: demo
        serviceMonitor:
          enabled: true
        trivy:
          ignoreUnfixed: true
        trivyOperator:
          scanJobsConcurrentLimit: 3
          scanJobTimeout: 5m
  destination:
    server: https://kubernetes.default.svc
    namespace: security
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
