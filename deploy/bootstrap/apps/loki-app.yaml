apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.6.0
    helm:
      values: |
        deploymentMode: SingleBinary
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        loki:
          auth_enabled: false
          useTestSchema: true
          storage:
            type: filesystem
            bucketNames:
              chunks: chunks
              ruler: ruler
              admin: admin
          commonConfig:
            replication_factor: 1
        singleBinary:
          replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
