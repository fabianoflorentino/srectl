apiVersion: v1
kind: ConfigMap
metadata:
  name: srectl-slo-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  srectl-slo.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "tags": ["sre", "slo"],
      "title": "srectl · SLO / Error Budget",
      "uid": "srectl-slo",
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "service",
            "label": "Service",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(error_budget_burn_rate, service_name)",
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": { "selected": true, "text": "All", "value": "$__all" },
            "refresh": 2,
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Error budget burn rate vs threshold",
          "description": "Burn rate above the threshold means the error budget is being spent too fast.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 16, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": { "unit": "x", "min": 0, "custom": { "lineWidth": 2 } },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (service_name, slo_name) (error_budget_burn_rate{service_name=~\"$service\"})",
              "legendFormat": "{{service_name}} · {{slo_name}}"
            },
            {
              "refId": "B",
              "expr": "max by (service_name, slo_name) (alerting_burn_rate_threshold{service_name=~\"$service\"})",
              "legendFormat": "threshold · {{service_name}} · {{slo_name}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "table",
          "title": "Current burn rate",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 8, "x": 16, "y": 0 },
          "fieldConfig": {
            "defaults": { "unit": "x", "decimals": 2 },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Burn rate" },
                "properties": [
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } },
                  { "id": "thresholds", "value": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (service_name, slo_name) (error_budget_burn_rate{service_name=~\"$service\"})",
              "instant": true,
              "format": "table"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "SLI measurement vs target",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 9 },
          "fieldConfig": {
            "defaults": { "unit": "percentunit", "min": 0, "max": 1 },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (service_name, slo_name) (sli_measurement{service_name=~\"$service\"})",
              "legendFormat": "{{service_name}} · {{slo_name}}"
            },
            {
              "refId": "B",
              "expr": "max by (service_name, slo_name) (slo_target{service_name=~\"$service\"})",
              "legendFormat": "target · {{service_name}} · {{slo_name}}"
            }
          ]
        }
      ]
    }
