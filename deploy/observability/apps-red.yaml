apiVersion: v1
kind: ConfigMap
metadata:
  name: srectl-dashboard-apps-red
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  srectl-apps-red.json: |
    {
      "annotations": { "list": [] },
      "tags": ["sre"],
      "editable": true,
      "graphTooltip": 0,
      "title": "srectl · App RED",
      "uid": "srectl-apps-red",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "api-a · request rate by route",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum by (route) (rate(api_a_http_requests_total[5m]))", "legendFormat": "{{route}}" }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "api-a · latency p50 / p95 / p99 (s)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.50, sum by (le) (rate(api_a_http_request_duration_seconds_bucket[5m])))", "legendFormat": "p50" },
            { "refId": "B", "expr": "histogram_quantile(0.95, sum by (le) (rate(api_a_http_request_duration_seconds_bucket[5m])))", "legendFormat": "p95" },
            { "refId": "C", "expr": "histogram_quantile(0.99, sum by (le) (rate(api_a_http_request_duration_seconds_bucket[5m])))", "legendFormat": "p99" }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "api-b · request rate by route",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum by (route) (rate(api_b_http_requests_total[5m]))", "legendFormat": "{{route}}" }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "api-b · latency p50 / p95 / p99 (s)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.50, sum by (le) (rate(api_b_http_request_duration_seconds_bucket[5m])))", "legendFormat": "p50" },
            { "refId": "B", "expr": "histogram_quantile(0.95, sum by (le) (rate(api_b_http_request_duration_seconds_bucket[5m])))", "legendFormat": "p95" },
            { "refId": "C", "expr": "histogram_quantile(0.99, sum by (le) (rate(api_b_http_request_duration_seconds_bucket[5m])))", "legendFormat": "p99" }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "5xx error ratio % (api-a / api-b)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 16 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "min": 0,
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum(rate(api_a_http_requests_total{status=~\"5..\"}[5m])) / clamp_min(sum(rate(api_a_http_requests_total[5m])), 1e-9)",
              "legendFormat": "api-a"
            },
            {
              "refId": "B",
              "expr": "100 * sum(rate(api_b_http_requests_total{status=~\"5..\"}[5m])) / clamp_min(sum(rate(api_b_http_requests_total[5m])), 1e-9)",
              "legendFormat": "api-b"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "api-a · requests by status",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 16 },
          "fieldConfig": {
            "defaults": { "unit": "reqps", "custom": { "stacking": { "mode": "normal" } } },
            "overrides": []
          },
          "targets": [
            { "refId": "A", "expr": "sum by (status) (rate(api_a_http_requests_total[5m]))", "legendFormat": "{{status}}" }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "api-b · requests by status",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 16 },
          "fieldConfig": {
            "defaults": { "unit": "reqps", "custom": { "stacking": { "mode": "normal" } } },
            "overrides": []
          },
          "targets": [
            { "refId": "A", "expr": "sum by (status) (rate(api_b_http_requests_total[5m]))", "legendFormat": "{{status}}" }
          ]
        }
      ]
    }
