apiVersion: v1
kind: ConfigMap
metadata:
  name: srectl-dashboard-cluster
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  srectl-cluster.json: |
    {
      "annotations": { "list": [] },
      "tags": ["sre"],
      "editable": true,
      "graphTooltip": 0,
      "title": "srectl · Cluster",
      "uid": "srectl-cluster",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Nodes Ready",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value" },
          "targets": [
            { "refId": "A", "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})" }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Pods Running",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value" },
          "targets": [
            { "refId": "A", "expr": "sum(kube_pod_status_phase{phase=\"Running\"})" }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Container restarts (1h)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 1 }, { "color": "red", "value": 10 } ] }
            },
            "overrides": []
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value" },
          "targets": [
            { "refId": "A", "expr": "sum(increase(kube_pod_container_status_restarts_total[1h]))" }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "CPU used (% of allocatable)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "min": 0,
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 70 }, { "color": "red", "value": 90 } ] }
            },
            "overrides": []
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value" },
          "targets": [
            { "refId": "A", "expr": "100 * sum(rate(container_cpu_usage_seconds_total{container!=\"\"}[5m])) / sum(kube_node_status_allocatable{resource=\"cpu\"})" }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Node CPU % by node",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0 }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "{{instance}}" }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Node memory % by node",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0 }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)", "legendFormat": "{{instance}}" }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Cluster CPU (cores): used vs allocatable",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(rate(container_cpu_usage_seconds_total{container!=\"\"}[5m]))", "legendFormat": "used" },
            { "refId": "B", "expr": "sum(kube_node_status_allocatable{resource=\"cpu\"})", "legendFormat": "allocatable" }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Cluster memory: used vs allocatable",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(container_memory_working_set_bytes{container!=\"\"})", "legendFormat": "used" },
            { "refId": "B", "expr": "sum(kube_node_status_allocatable{resource=\"memory\"})", "legendFormat": "allocatable" }
          ]
        },
        {
          "id": 9,
          "type": "bargauge",
          "title": "Top pods by CPU (cores)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 22 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": { "orientation": "horizontal", "displayMode": "gradient" },
          "targets": [
            { "refId": "A", "expr": "topk(10, sum by (namespace,pod) (rate(container_cpu_usage_seconds_total{container!=\"\"}[5m])))", "legendFormat": "{{namespace}}/{{pod}}" }
          ]
        },
        {
          "id": 10,
          "type": "bargauge",
          "title": "Top pods by memory (working set)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 22 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "options": { "orientation": "horizontal", "displayMode": "gradient" },
          "targets": [
            { "refId": "A", "expr": "topk(10, sum by (namespace,pod) (container_memory_working_set_bytes{container!=\"\"}))", "legendFormat": "{{namespace}}/{{pod}}" }
          ]
        }
      ]
    }
