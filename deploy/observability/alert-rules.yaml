apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: srectl-test-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: srectl
      rules:
        - alert: TestAlert
          expr: vector(1)
          labels:
            severity: info
          annotations:
            summary: "srectl test alert is firing"
