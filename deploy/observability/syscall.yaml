apiVersion: v1
kind: ConfigMap
metadata:
  name: srectl-dashboard-syscall
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  srectl-syscall.json: |
    {
      "annotations": { "list": [] },
      "tags": ["sre"],
      "editable": true,
      "graphTooltip": 0,
      "title": "srectl · Syscall",
      "uid": "srectl-syscall",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Syscalls / sec (attached process)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value" },
          "targets": [
            { "refId": "A", "expr": "sum(stracectl_syscalls_per_second)" }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Top syscalls by rate",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 18, "x": 6, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "topk(8, sum by (syscall) (rate(stracectl_syscall_calls_total[2m])))", "legendFormat": "{{syscall}}" }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Syscall errors by rate",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum by (syscall) (rate(stracectl_syscall_errors_total[2m]))", "legendFormat": "{{syscall}}" }
          ]
        },
        {
          "id": 4,
          "type": "bargauge",
          "title": "Avg duration by syscall (top 8)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "options": { "orientation": "horizontal", "displayMode": "gradient" },
          "targets": [
            { "refId": "A", "expr": "topk(8, sum by (syscall) (stracectl_syscall_duration_avg_seconds))", "legendFormat": "{{syscall}}" }
          ]
        }
      ]
    }
