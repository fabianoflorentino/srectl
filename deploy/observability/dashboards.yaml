apiVersion: v1
kind: ConfigMap
metadata:
  name: srectl-dashboard-logs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  srectl-logs.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 0,
      "title": "srectl · Logs",
      "uid": "srectl-logs",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": { "type": "loki", "uid": "loki" },
            "query": "label_values(namespace)",
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": { "selected": true, "text": "All", "value": "$__all" },
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "search",
            "label": "Search",
            "type": "textbox",
            "query": "",
            "current": { "selected": false, "text": "", "value": "" }
          }
        ]
      },
      "panels": [
        {
          "type": "logs",
          "title": "Log stream · {namespace=~\"$namespace\"}",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 16, "w": 16, "x": 0, "y": 0 },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          },
          "targets": [
            { "refId": "A", "expr": "{namespace=~\"$namespace\"} |~ \"$search\"" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Error lines / 5m by namespace",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum by (namespace) (count_over_time({level=\"error\"}[5m]))" }
          ]
        },
        {
          "type": "logs",
          "title": "Errors · level=\"error\"",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 8 },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          },
          "targets": [
            { "refId": "A", "expr": "{level=\"error\"} |~ \"$search\"" }
          ]
        }
      ]
    }
