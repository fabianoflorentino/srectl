apiVersion: v1
kind: ConfigMap
metadata:
  name: srectl-dashboard-golden-signals
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  srectl-golden-signals.json: |
    {
      "annotations": { "list": [] },
      "tags": ["sre"],
      "editable": true,
      "graphTooltip": 1,
      "title": "srectl · Golden Signals",
      "uid": "srectl-golden-signals",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "ingress",
            "label": "Ingress",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(nginx_ingress_controller_requests, ingress)",
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": { "selected": true, "text": "All", "value": "$__all" },
            "refresh": 2,
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Traffic (requests/s)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(rate(nginx_ingress_controller_requests{ingress=~\"$ingress\"}[5m]))" }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Error rate (5xx %)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "min": 0,
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum(rate(nginx_ingress_controller_requests{ingress=~\"$ingress\",status=~\"5..\"}[5m])) / sum(rate(nginx_ingress_controller_requests{ingress=~\"$ingress\"}[5m])) or vector(0)"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Traffic by HTTP status",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status) (rate(nginx_ingress_controller_requests{ingress=~\"$ingress\"}[5m]))",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Latency p50 / p90 / p99 (s)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(nginx_ingress_controller_request_duration_seconds_bucket{ingress=~\"$ingress\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.90, sum by (le) (rate(nginx_ingress_controller_request_duration_seconds_bucket{ingress=~\"$ingress\"}[5m])))",
              "legendFormat": "p90"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(nginx_ingress_controller_request_duration_seconds_bucket{ingress=~\"$ingress\"}[5m])))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Saturation · node CPU %",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 16 },
          "fieldConfig": {
            "defaults": { "unit": "percent", "max": 100, "min": 0 },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Saturation · node memory %",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 16 },
          "fieldConfig": {
            "defaults": { "unit": "percent", "max": 100, "min": 0 },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Saturation · filesystem used %",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 16 },
          "fieldConfig": {
            "defaults": { "unit": "percent", "max": 100, "min": 0 },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{fstype!~\"tmpfs|overlay\"})",
              "legendFormat": "{{instance}} {{mountpoint}}"
            }
          ]
        },
        {
          "id": 8,
          "type": "bargauge",
          "title": "Top namespaces by CPU (cores)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": { "orientation": "horizontal", "displayMode": "gradient" },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(5, sum by (namespace) (rate(container_cpu_usage_seconds_total{container!=\"\",namespace!=\"\"}[5m])))",
              "legendFormat": "{{namespace}}"
            }
          ]
        },
        {
          "id": 9,
          "type": "bargauge",
          "title": "Top namespaces by memory (working set)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "options": { "orientation": "horizontal", "displayMode": "gradient" },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(5, sum by (namespace) (container_memory_working_set_bytes{container!=\"\",namespace!=\"\"}))",
              "legendFormat": "{{namespace}}"
            }
          ]
        }
      ]
    }
