name: images

# Builds and publishes the demo API images to GHCR, pinned by git SHA and tags.
# The three external projects (fraudctl, stracectl, certificate-validate) are
# built and published by their own repositories' CI and mirrored into the registry.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/api-a/**"
      - "apps/api-b/**"
      - "apps/slo-generator/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api-a, api-b, slo-generator]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/srectl-${{ matrix.app }}
          tags: |
            type=sha,prefix=
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
