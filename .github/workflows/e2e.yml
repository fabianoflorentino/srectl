name: e2e

# Full end-to-end test on a real kind cluster: build every image, bring the
# platform up with Argo CD, then verify the cluster, all services, ingress,
# metrics, SLOs and a chaos drill. Heavy (LGTM + security + chaos), so it runs
# nightly/manually instead of on every pull request.

on:
  workflow_dispatch:
    inputs:
      skip_chaos:
        description: Skip the chaos drill
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: false

env:
  # Argo CD must reconcile the exact commit under test, not whatever main is at.
  SRECTL_ARGOCD_REPO: ${{ github.server_url }}/${{ github.repository }}
  SRECTL_ARGOCD_REVISION: ${{ github.sha }}
  E2E_SKIP_CHAOS: ${{ inputs.skip_chaos || 'false' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      - name: Install kind, kubectl, helm
        run: |
          curl -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
          curl -fsSLo ./kubectl "https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl"
          chmod +x ./kubectl && sudo mv ./kubectl /usr/local/bin/kubectl
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Build the srectl CLI
        run: make build

      - name: Build in-repo images
        run: |
          set -euo pipefail
          docker build -f apps/api-a/Dockerfile -t srectl/api-a:dev .
          docker build -f apps/api-b/Dockerfile -t srectl/api-b:dev .
          SLO_IMAGE="$(awk '/srectl-slo-generator/ {print $2; exit}' deploy/slo/cronjob.yaml)"
          test -n "$SLO_IMAGE" || { echo "::error::slo-generator image not found in deploy/slo/cronjob.yaml"; exit 1; }
          docker build -t "$SLO_IMAGE" -f apps/slo-generator/Dockerfile .
          echo "SLO_IMAGE=$SLO_IMAGE" >> "$GITHUB_ENV"

      - name: Build project images (fraudctl, certificate-validate)
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/fabianoflorentino/fraudctl.git /tmp/fraudctl
          docker build -t srectl/fraudctl:dev /tmp/fraudctl
          docker build -t srectl/fraudctl-lb:dev /tmp/fraudctl/cmd/lb

          git clone --depth 1 https://github.com/fabianoflorentino/certificate-validate.git /tmp/certificate-validate
          docker build -t srectl/certificate-validate:dev /tmp/certificate-validate

      - name: Create the kind cluster
        run: ./bin/srectl cluster create

      - name: Load images into kind
        run: |
          kind load docker-image \
            srectl/api-a:dev \
            srectl/api-b:dev \
            srectl/fraudctl:dev \
            srectl/fraudctl-lb:dev \
            srectl/certificate-validate:dev \
            "$SLO_IMAGE" \
            --name srectl

      - name: srectl up (bootstrap Argo CD and the platform)
        run: ./bin/srectl up

      - name: Point local hostnames at the kind ingress
        run: |
          sudo sh -c 'printf "127.0.0.1 hello.localhost api-a.localhost fraudctl.localhost seraph.localhost\n" >> /etc/hosts'

      - name: Wait for Argo CD applications to converge
        run: |
          ./bin/srectl sync || true
          for i in $(seq 1 60); do
            if ./bin/srectl demo verify; then
              echo "platform healthy"
              exit 0
            fi
            echo "waiting for apps to converge ($i/60)"
            sleep 15
          done
          echo "::error::platform did not converge in time"
          ./bin/srectl status
          exit 1

      - name: Verify the cluster and every service
        run: ./scripts/e2e-verify.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          {
            echo "=== nodes ==="; kubectl get nodes -o wide
            echo "=== argocd applications ==="; kubectl get applications -n argocd -o wide
            echo "=== pods ==="; kubectl get pods -A -o wide
            echo "=== deployments/daemonsets/jobs ==="
            for ns in argocd cert-manager chaos-mesh chaos demo ingress-nginx kyverno monitoring projects security; do
              echo "--- $ns ---"
              kubectl -n "$ns" get deploy,ds,sts,job,cronjob 2>/dev/null || true
            done
            echo "=== recent events ==="
            kubectl get events -A --sort-by=.lastTimestamp | tail -80
            echo "=== top nodes ==="; kubectl top nodes || true
            echo "=== top pods by memory ==="; kubectl top pods -A --sort-by=memory | head -20 || true
            echo "=== host memory ==="; free -h
            echo "=== falco describe ==="
            kubectl -n security describe pod -l app.kubernetes.io/name=falco | tail -120 || true
            echo "=== falco logs ==="
            for p in $(kubectl -n security get pods -l app.kubernetes.io/name=falco -o name 2>/dev/null); do
              kubectl -n security logs "$p" -c falco --tail=60 --previous 2>/dev/null \
                || kubectl -n security logs "$p" -c falco --tail=60 2>/dev/null \
                || true
            done
            echo "=== chaos-mesh describe ==="
            kubectl -n chaos-mesh describe pod -l app.kubernetes.io/name=chaos-mesh | tail -120 || true
            echo "=== chaos-mesh logs ==="
            kubectl -n chaos-mesh logs deploy/chaos-controller-manager --tail=80 --previous 2>/dev/null \
              || kubectl -n chaos-mesh logs deploy/chaos-controller-manager --tail=80 2>/dev/null \
              || true
            echo "=== logs: api-a ==="; kubectl -n demo logs deploy/api-a --tail=80 || true
            echo "=== logs: api-b ==="; kubectl -n demo logs deploy/api-b --tail=80 || true
            echo "=== logs: fraudctl (lb) ==="; kubectl -n projects logs deploy/fraudctl -c lb --tail=80 || true
          } >&2

      - name: srectl down (always)
        if: always()
        run: ./bin/srectl down
