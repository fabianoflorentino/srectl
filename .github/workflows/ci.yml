name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Race
        run: go test -race ./...
      - name: Coverage gate (>= 80%)
        run: make coverage

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Build CLI and demo APIs
        run: go build ./cmd/srectl ./apps/api-a ./apps/api-b

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No :latest image tags in GitOps
        run: |
          if grep -rInE 'image:.*:latest' deploy/; then
            echo "::error::GitOps manifests must pin image tags (no :latest)."
            exit 1
          fi
          echo "no :latest image tags in deploy/"
