name: debug-falco

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falco:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        driver: [modern_ebpf, kmod, auto]
    steps:
      - uses: actions/checkout@v4
      - name: Install kind, kubectl, helm
        run: |
          curl -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
          curl -fsSLo ./kubectl "https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl"
          chmod +x ./kubectl && sudo mv ./kubectl /usr/local/bin/kubectl
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Create kind cluster
        run: kind create cluster --name falco-debug --config deploy/kind/kind-config.yaml --wait 180s
      - name: Install Falco (${{ matrix.driver }})
        run: |
          helm repo add falcosecurity https://falcosecurity.github.io/charts --force-update
          helm upgrade --install falco falcosecurity/falco \
            --namespace security --create-namespace --version 9.2.2 \
            --set driver.kind=${{ matrix.driver }} \
            --set falco.json_output=true \
            --set falcosidekick.enabled=true \
            --timeout 3m || true
          sleep 30
          kubectl -n security get pods -o wide || true
          kubectl -n security logs ds/falco -c falco --tail=120 || true
          kubectl -n security describe pod -l app.kubernetes.io/name=falco | tail -80 || true
      - name: Delete cluster
        if: always()
        run: kind delete cluster --name falco-debug

  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install kind, kubectl, helm
        run: |
          curl -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
          curl -fsSLo ./kubectl "https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl"
          chmod +x ./kubectl && sudo mv ./kubectl /usr/local/bin/kubectl
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Create kind cluster
        run: kind create cluster --name chaos-debug --config deploy/kind/kind-config.yaml --wait 180s
      - name: Install chaos-mesh
        run: |
          helm repo add chaos-mesh https://charts.chaos-mesh.org --force-update
          helm upgrade --install chaos-mesh chaos-mesh/chaos-mesh \
            --namespace chaos-mesh --create-namespace --version 2.8.8 \
            --set chaosDaemon.runtime=containerd \
            --set chaosDaemon.socketPath=/run/containerd/containerd.sock \
            --set controllerManager.replicaCount=1 \
            --set dashboard.create=false \
            --timeout 3m || true
          sleep 30
          kubectl -n chaos-mesh get pods -o wide || true
          kubectl -n chaos-mesh logs deploy/chaos-controller-manager --tail=120 || true
          kubectl -n chaos-mesh describe pod -l app.kubernetes.io/name=chaos-mesh | tail -80 || true
      - name: Delete cluster
        if: always()
        run: kind delete cluster --name chaos-debug
