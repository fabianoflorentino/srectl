# golangci-lint v2 configuration. Linters are grouped by intent as described in
# the golang-lint skill (correctness, style, complexity, concurrency, security).
version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/fabianoflorentino/srectl

linters:
  enable:
    # correctness
    - govet
    - staticcheck
    - errcheck
    - nilerr
    - ineffassign
    - unused
    # style
    - revive
    - misspell
    - predeclared
    # complexity
    - gocritic
    # concurrency
    - thelper
    # security
    - gosec
    # misc
    - nolintlint
  settings:
    nolintlint:
      require-specific: true
      require-explanation: true
    revive:
      confidence: 0.8
  exclusions:
    rules:
      - path: (_test|_bench)\.go$
        linters:
          - gosec
    generated: lax

issues:
  new-from-rev: HEAD~1
